# Create system user
action: create
module: users/ldap
position: cn=users,{{ ldapBaseDn }}
properties:
  username: "oxSystemUser"
  lastname: "LDAP-system-User"
  password: {{ oxSystemUserPassword }}
  overridePWHistory: true
  overridePWLength: true
---
# Create Ox portal tile for Domain Users
action: create_or_modify
module: portals/entry
position: cn=entry,cn=portals,cn=univention,{{ ldapBaseDn }}
properties:
  name: "ox_mail"
  icon: ""
  link:
    - - en_US
      - {{ portalOxLinkBase }}/appsuite/#app=io.ox/mail
  allowedGroups:
    - 'cn=Domain Users,cn=groups,{{ ldapBaseDn }}'
  linkTarget: newwindow
  description:
    de_DE: E-Mails senden und empfangen
    en_US: Send and receive emails
  displayName:
    de_DE: Open-Xchange
    en_US: Open-Xchange
---
action: ensure_list_contains
module: portals/category
position: cn=domain-service,cn=category,cn=portals,cn=univention,{{ ldapBaseDn }}
properties:
  entries:
  - cn=ox_mail,cn=entry,cn=portals,cn=univention,{{ ldapBaseDn }}
  - cn=ox_context_admin,cn=entry,cn=portals,cn=univention,{{ ldapBaseDn }}
---
action: create
module: settings/umc_operationset
position: cn=operations,cn=UMC,cn=univention,{{ ldapBaseDn }}
properties:
  name: "ox-shared-accounts"
  description: Administration for OX shared accounts
  flavor: oxmail/shared_account
  hosts: []
  objectFlag: []
  operation:
    - command: "udm/*"
      option: "objectType=users/user"
    - command: "udm/*"
      option: "objectType=groups/group"
    - command: "udm/*"
      option: "objectType=oxmail/shared_account_permission"
    - command: "udm/*"
      option: "objectType=oxmail/shared_account"
---
action: create
module: settings/umc_operationset
position: cn=operations,cn=UMC,cn=univention,{{ ldapBaseDn }}
properties:
  name: "ox-functional-accounts"
  description: Administration for OX functional mailboxes
  flavor: oxmail/functional_account
  hosts: []
  objectFlag: []
  operation:
    - command: "udm/*"
      option: "objectType=users/user"
    - command: "udm/*"
      option: "objectType=oxmail/functional_account"
---
action: create
module: settings/umc_operationset
position: cn=operations,cn=UMC,cn=univention,{{ ldapBaseDn }}
properties:
  name: "ox-resources"
  description: Administration for OX resources
  flavor: oxresources/oxresources
  hosts: []
  objectFlag: []
  operation:
    - command: "udm/*"
      option: "objectType=oxresources/*"
    - command: "udm/properties"
      option: "objectType=policies/*"
    - command: "udm/layout"
      option: "objectType=policies/*"
    - command: "udm/query"
      option: "objectType=policies/*"
---
action: create
