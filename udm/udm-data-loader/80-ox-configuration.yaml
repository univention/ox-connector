---
# Create Ox context portal tile for Domain Admins
action: create_or_modify
module: portals/entry
position: cn=entry,cn=portals,cn=univention,{{ ldapBaseDn }}
properties:
  activated: true
  name: "ox_context_admin"
  icon: ""
  link:
    - - en_US
      - /univention/management/?header=try-hide&overview=false&menu=false#module=udm:oxmail/oxcontext
  allowedGroups:
