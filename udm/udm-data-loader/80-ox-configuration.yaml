# Create system user
action: create
module: users/ldap
position: cn=users,{{ ldapBaseDn }}
properties:
  username: "oxSystemUser"
  lastname: "LDAP-system-User"
  password: {{ oxSystemUserPassword }}
  overridePWHistory: true
  overridePWLength: true
---
# Create Ox portal tile for Domain Users
action: create_or_modify
module: portals/entry
position: cn=entry,cn=portals,cn=univention,{{ ldapBaseDn }}
properties:
  name: "ox_mail"
  icon: ""
  link:
    - - en_US
      - {{ portalOxLinkBase }}/appsuite/#app=io.ox/mail
  allowedGroups:
    - 'cn=Domain Users,cn=groups,{{ ldapBaseDn }}'
  linkTarget: newwindow
  description:
    de_DE: E-Mails senden und empfangen
    en_US: Send and receive emails
  displayName:
    de_DE: Open-Xchange
    en_US: Open-Xchange
---
# Create Ox functional account portal tile for Domain Admins
action: create_or_modify
module: portals/entry
position: cn=entry,cn=portals,cn=univention,{{ ldapBaseDn }}
properties:
  activated: true
  name: "ox_functional_admin"
  icon: ""
  link:
    - - en_US
      - /univention/management/?header=try-hide&overview=false&menu=false#module=udm:oxmail/functional_account
  allowedGroups:
    - 'cn=Domain Admins,cn=groups,{{ ldapBaseDn }}'
  linkTarget: newwindow
  description:
    de_DE: Verwaltung von Funktionspostfächern
    en_US: Manage functional mailboxes
  displayName:
    de_DE: Funktionspostfächer
    en_US: Functional mailboxes
---
# Create Ox resources portal tile for Domain Admins
action: create_or_modify
module: portals/entry
position: cn=entry,cn=portals,cn=univention,{{ ldapBaseDn }}
properties:
  activated: true
  name: "ox_resources_admin"
  icon: ""
  link:
    - - en_US
      - /univention/management/?header=try-hide&overview=false&menu=false#module=udm:oxresources/oxresources
  allowedGroups:
    - 'cn=Domain Admins,cn=groups,{{ ldapBaseDn }}'
