---
kind: "ConfigMap"
apiVersion: "v1"
metadata:
  name: "{{ include "common.names.fullname" . }}"
  namespace: {{ include "common.names.namespace" . | quote }}
  labels:
    {{- include "common.labels.standard" ( dict "customLabels" .Values.additionalLabels "context" . ) | nindent 4 }}
  {{- include "nubus-common.annotations.render" ( dict
    "values" ( list .Values.additionalAnnotations )
    "context" . )
    | nindent 2 }}
data:

  PROVISIONING_API_BASE_URL: {{ .Values.provisioningApi.connection.baseUrl | quote }}
  PROVISIONING_API_USERNAME: {{ .Values.provisioningApi.auth.username | quote }}
  MAX_ACKNOWLEDGEMENT_RETRIES: {{ required "The parameter \".Values.provisioningApi.config.maxAcknowledgementRetries\" is required." .Values.provisioningApi.config.maxAcknowledgementRetries | quote }}

  DOMAINNAME: "{{ .Values.openXchange.domainName }}"
  OX_MASTER_ADMIN: "{{ .Values.openXchange.auth.username }}"
  LOCAL_TIMEZONE: "{{ .Values.openXchange.oxLocalTimezone }}"
  OX_LANGUAGE: "{{ .Values.openXchange.oxLanguage }}"
  DEFAULT_CONTEXT: "{{ .Values.openXchange.oxDefaultContext }}"
  OX_SMTP_SERVER: "{{ .Values.openXchange.oxSmtpServer }}"
  OX_IMAP_SERVER: "{{ .Values.openXchange.oxImapServer }}"
  OX_SOAP_SERVER: "{{ .Values.openXchange.oxSoapServer }}"
  OX_ENABLE_DEPUTY_PERMISSIONS: "{{ .Values.openXchange.oxDeputyPermissions }}"
  LOG_LEVEL: "{{ .Values.openXchange.logLevel }}"
  wait-for-api.sh: |
    #!/bin/bash
    until curl -s ${PROVISIONING_API_BASE_URL} > /dev/null; do
      echo "Waiting for API"
      sleep 2
    done

    echo "Success, the Provisioning API is available"
