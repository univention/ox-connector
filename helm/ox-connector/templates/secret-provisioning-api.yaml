{{- if not (.Values.provisioningApi.auth.existingSecret).name }}
{{- $name := include "nubus-common.secrets.name" (dict "defaultNameSuffix" "provisioning-api" "context" .) -}}
{{- $username := default (include "common.names.fullname" .) .Values.provisioningApi.auth.username }}
{{- $oxConnectorSubscriptionPassword := include "nubus-common.secrets.passwords.manage"
  (dict
    "secret" $name
    "key" "password"
    "username" $username
    "providedValues" (list "provisioningApi.auth.password")
    "context" .
  )
}}
---
apiVersion: "v1"
kind: "Secret"
metadata:
  name: {{ $name | quote }}
  namespace: {{ include "common.names.namespace" . | quote }}
  labels:
    {{- include "common.labels.standard" ( dict "customLabels" .Values.additionalLabels "context" . ) | nindent 4 }}
  annotations:
    {{- if (.Values.global.secrets).keep }}
    helm.sh/resource-policy: keep
    {{- end }}
    {{- if .Values.additionalAnnotations }}
      {{- include "common.tplvalues.render" ( dict "value" .Values.additionalAnnotations "context" . ) | nindent 4 }}
    {{- end }}
stringData:
  registration: |
    {
      "name": {{ $username | quote }},
      "realms_topics": [
        {
          "realm": "udm",
          "topic": "oxmail/oxcontext"
        },
        {
          "realm": "udm",
          "topic": "oxmail/accessprofile"
        },
        {
          "realm": "udm",
          "topic": "users/user"
        },
        {
          "realm": "udm",
          "topic": "oxresources/oxresources"
        },
        {
          "realm": "udm",
          "topic": "groups/group"
        },
        {
          "realm": "udm",
          "topic": "oxmail/functional_account"
        },
        {
          "realm": "udm",
          "topic": "oxmail/shared_account"
        },
        {
          "realm": "udm",
          "topic": "oxmail/shared_account_permission"
        }
      ],
      "request_prefill": true,
      "password": {{ $oxConnectorSubscriptionPassword | quote }}
    }
  username: {{ $username | quote }}
  password: {{ $oxConnectorSubscriptionPassword | quote }}
{{- end }}
