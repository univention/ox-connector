---
# Default values for ox-connector.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# Global values configure shared settings for multiple charts.
global:
  # -- Container registry address.
  imageRegistry: "artifacts.software-univention.de"
  # -- Credentials to fetch images from a private registry.
  # For details, see https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/.
  imagePullSecrets: []

  # -- Image pull policy for all container images that don't define their own pull policy.
  # For details, see https://kubernetes.io/docs/concepts/containers/images/#image-pull-policy.
  imagePullPolicy: null

# Configuration for communication with the Provisioning API.
provisioningApi:
  config:
    # -- Maximum number of retries for acknowledging a message.
    maxAcknowledgementRetries: 3
  # -- Connection parameters for the Provisioning API.
  connection:
    # -- Base URL where the Provisioning API is reachable, for example "https://provisioning-api".
    baseUrl: ""
  # -- Authentication parameters for the Provisioning API subscription user.
  auth:
    # -- Username for authenticating to the Provisioning API.
    username: "ox-consumer"
    # -- Password for authenticating to the Provisioning API.
    password: null
    existingSecret:
      # -- Name of an existing Secret that contains the Provisioning API password.
      # The value in "provisioningApi.auth.password" is ignored if this value is set.
      name: null
      keyMapping:
        # -- Key in the existing Secret that contains the password.
        # Set this value to use a key with a different name.
        password: null
  resync:
    # -- Enable database resync on the first startup if the database is empty.
    enabled: true
    auth:
      # -- Admin username for authenticating to the Provisioning API during resync.
      username: "admin"
      # -- Admin password for authenticating to the Provisioning API during resync.
      password: null
      existingSecret:
        # -- Name of an existing Secret that contains the Provisioning API admin password.
        # The value in "provisioningApi.resync.auth.password" is ignored if this value is set.
        name: null
        keyMapping:
          # -- Key in the existing Secret that contains the admin password.
          # Set this value to use a key with a different name.
          password: null

oxConnector:
  image:
    # -- Image pull policy for the OX Connector container image.
    pullPolicy: null
    # -- Container registry for the OX Connector image.
    registry: null
    # -- Repository of the OX Connector image.
    repository: "nubus-dev/images/ox-connector-standalone"
    # -- Tag of the OX Connector image.
    tag: "latest"

  # -- Array with extra environment variables to add to containers.
  extraEnvVars: []

# Configuration for the OX Connector.
openXchange:
  # -- OX mail domain that the connector uses to generate email addresses.
  domainName: null
  auth:
    # -- Username of the OX Admin user.
    # The OX Admin user can create, modify, and delete contexts and must already exist.
    username: "oxadminmaster"
    # -- Password of the OX Admin user.
    password: null
    existingSecret:
      # -- Name of an existing Secret that contains the OX Admin password.
      # The value in "openXchange.auth.password" is ignored if this value is set.
      name: null
      keyMapping:
        # -- Key in the existing Secret that contains the OX Admin password.
        # Set this value to use a key with a different name.
        password: null
  # -- Default time zone for new users.
  oxLocalTimezone: "Europe/Berlin"
  # -- Default language for new users.
  oxLanguage: "de_DE"
  # -- Default OX context for users. The context must already exist.
  oxDefaultContext: "10"
  # -- Default SMTP server for new users if no SMTP server is set on the user object.
  oxSmtpServer: null
  # -- Default IMAP server for new users if no IMAP server is set on the user object.
  oxImapServer: null
  # -- Server where OX App Suite is installed.
  oxSoapServer: null
  # -- OX Connector log level. Choose from "DEBUG", "INFO", "WARNING", and "ERROR".
  logLevel: "INFO"
  # -- Enable provisioning of OX deputy permissions.
  oxDeputyPermissions: false
  # -- Enable provisioning of OX shared accounts.
  oxSharedAccount: true
  # -- SQLAlchemy DB connection URL for the OX connector.
  # Ignored if "openXchange.database.existingSecret.name" is set.
  oxDbConnectionString: null
  database:
    existingSecret:
      # -- Name of an existing Secret that contains the SQLAlchemy DB connection URL.
      # The value in "openXchange.oxDbConnectionString" is ignored if this value is set.
      # Providing the URL this way keeps the database password out of the rendered manifests.
      name: null
      keyMapping:
        # -- Key in the existing Secret that holds the connection URL.
        # Defaults to the key the chart uses in its own Secret.
        OX_CONNECTOR_DB: null
  mappings:
    # -- UDM user property that the connector uses as the unique user identifier in OX.
    userIdentifier: "username"
    # -- UDM group property that the connector uses as the unique group identifier in OX.
    groupIdentifier: "name"
    # -- UDM shared account property that the connector uses as the unique shared account identifier in OX.
    sharedAccountIdentifier: "name"

waitForDependency:
  image:
    # -- Image pull policy for the dependency waiter image.
    pullPolicy: null
    # -- Container registry for the dependency waiter image.
    registry: null
    # -- Repository of the dependency waiter image.
    repository: "nubus/images/wait-for-dependency"
    # -- Tag of the dependency waiter image.
    tag: "0.36.12@sha256:7150d72c8f342a05b945ce1b21464864aa91590d00f65ebe4b628571cce34efc"

# Persistent volume claim settings.
persistence:
  # -- Storage class name. Leave empty to use the default storage class.
  storageClass: ""
  # -- Persistent volume claim size.
  size: 1Gi

# -- Pod affinity rules for the OX Connector workload.
affinity: {}
# -- Additional environment variables for deployment templates.
environment: {}
# -- Override the fully qualified chart name.
fullnameOverride: ""
# -- Override the chart name.
nameOverride: ""
# -- Node selector for scheduling the OX Connector pod.
nodeSelector: {}
# -- Additional annotations for the OX Connector pod.
podAnnotations: {}
# -- Number of OX Connector replicas.
replicaCount: 1
# -- Tolerations for scheduling the OX Connector pod.
tolerations: []

# -- Optionally specify an extra list of additional volumes.
extraVolumes: []

# -- Optionally specify an extra list of additional volumeMounts.
extraVolumeMounts: []

# Container deployment probes.
probes:
  liveness:
    # -- Initial delay in seconds before the liveness probe starts.
    initialDelaySeconds: 120
    # -- Timeout in seconds for the liveness probe.
    timeoutSeconds: 3
    # -- Interval in seconds between liveness probe executions.
    periodSeconds: 30
    # -- Number of failed liveness probes before Kubernetes restarts the container.
    failureThreshold: 3
    # -- Number of successful liveness probes required to mark the container healthy.
    successThreshold: 1
    exec:
      # -- Command for the liveness probe.
      command:
        - /bin/sh
        - -c
        - |
          exit 0

  readiness:
    # -- Initial delay in seconds before the readiness probe starts.
    initialDelaySeconds: 30
    # -- Timeout in seconds for the readiness probe.
    timeoutSeconds: 3
    # -- Interval in seconds between readiness probe executions.
    periodSeconds: 15
    # -- Number of failed readiness probes before Kubernetes marks the container not ready.
    failureThreshold: 30
    # -- Number of successful readiness probes required to mark the container ready.
    successThreshold: 1
    exec:
      # -- Command for the readiness probe.
      command:
        - /bin/sh
        - -c
        - |
          exit 0

# Deployment resources for the OX Connector container.
resources:
  requests:
    # -- Requested memory for the OX Connector container.
    memory: "512Mi"
    # -- Requested CPU for the OX Connector container.
    cpu: "250m"
  limits:
    # -- Memory limit for the OX Connector container.
    memory: "4Gi"
    # -- CPU limit for the OX Connector container.
    cpu: "4"

# -- Deployment resources for the dependency waiters
resourcesWaitForDependency:
  requests:
    # -- Requested memory for dependency waiter containers.
    memory: "64Mi"
    # -- Requested CPU for dependency waiter containers.
    cpu: "100m"
  limits:
    # -- Memory limit for dependency waiter containers.
    memory: "128Mi"
    # -- CPU limit for dependency waiter containers.
    cpu: "200m"

serviceAccount:
  # -- Create a service account for the OX Connector.
  create: true
  # -- Additional annotations for the service account.
  annotations: {}
  # -- Service account name. If this value is empty and "serviceAccount.create" is true, the chart generates a name from the fullname template.
  name: ""
  # -- Allow automatic mounting of the service account token.
  automountServiceAccountToken: false
  # -- Additional custom labels for the ServiceAccount.
  labels: {}

podSecurityContext:
  # -- File system group ID for mounted volumes.
  fsGroup: 1000
  # -- User ID for the OX Connector pod.
  runAsUser: 1000
  # -- Group ID for the OX Connector pod.
  runAsGroup: 1000
  # -- Require the OX Connector pod to run as a non-root user.
  runAsNonRoot: true
  seccompProfile:
    # -- Seccomp profile type for the OX Connector pod.
    type: "RuntimeDefault"

securityContext:
  # -- Run the OX Connector container in privileged mode.
  privileged: false
  # -- Allow privilege escalation in the OX Connector container.
  allowPrivilegeEscalation: false
  # -- Mount the OX Connector container root filesystem as read-only.
  readOnlyRootFilesystem: true
  # -- User ID for the OX Connector container.
  runAsUser: 1000
  # -- Group ID for the OX Connector container.
  runAsGroup: 1000
  # -- Require the OX Connector container to run as a non-root user.
  runAsNonRoot: true
  seccompProfile:
    # -- Seccomp profile type for the OX Connector container.
    type: "RuntimeDefault"
  capabilities:
    # -- Linux capabilities to drop from the OX Connector container.
    drop:
      - "ALL"
