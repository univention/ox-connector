---
include:
  - project: "univention/dev/nubus-for-k8s/common-ci"
    ref: "v1.68.2"
    file:
      - "defaults/stages.yaml"
      - "defaults/nubus-workflow.yaml"
      - "jobs/lint-pre-commit.yaml"
      - "jobs/lint-commit-messages.yaml"
      - "jobs/semantic-release-env.yaml"

  - local: ".gitlab-ci/product-jobs.yml"
    rules:
      - if: '$RUN_RENOVATE == "yes"'
        when: never
      - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
        changes:
          - ".gitlab-ci.yml"
          - ".gitlab-ci/product-jobs.yml"
          - "ci/**/*"
          - "helm/**/*"
          - "helm-unittests/**/*"
          - "nubus-test-environment/**/*"
          - "tests/**/*"
          - ".dockerignore"
          - "Dockerfile"
          - "app/**/*"
          - "appcenter-entrypoint.sh"
          - "entrypoint.sh"
          - "k8s-entrypoint.sh"
          - "ldap/**/*"
          - "ox-extension/**/*"
          - "scripts/**/*"
          - "share/**/*"
          - "standalone-files/**/*"
          - "udm/**/*"
          - "umc/**/*"
          - "univention-ox-provisioning/**/*"
          - "univention-ox-soap-api/**/*"
          - "pyproject.toml"
          - "uv.lock"
      - if: '$CI_PIPELINE_SOURCE != "merge_request_event"'
  - component: "$CI_SERVER_FQDN/univention/dev/tooling/ci-components/ai-review@2.8.0"

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_OPEN_MERGE_REQUESTS'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_REF_PROTECTED == "true"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "webide"'

variables:
  # Variables for sphinx-docs
  LANG: "C.UTF-8"
  DEBIAN_FRONTEND: "noninteractive"
  UNIVENTION_BASECONF: "/dev/null"
  SOUVAP_HELM_PROJECT_ID: "128"

  # Variables for deploy-and-test
  AUTO_TRIGGER_TESTS:
    description: |
      Deployment and e2e test run will be triggered automatically if this is set
      to "yes".
    value: "no"
    options:
      - "yes"
      - "no"
  SKIP_TESTRUN:
    description: |
      Allows to skip the testrun itself, so that the pipeline can be used to
      create a deployment only.
    value: "no"
    options:
      - "yes"
      - "no"
  SKIP_CLEANUP:
    description: |
      Skips the automatic cleanup after the testrun.
    value: "no"
    options:
      - "yes"
      - "no"

get-appcenter-version:
  stage: prepare
  needs: []
  script:
    - |
      APPCENTER_VERSION=$(sed -n 's/^Version[[:space:]]*=[[:space:]]*//p' app/ini)
      echo "APPCENTER_VERSION=${APPCENTER_VERSION}" > appcenter-version.env
      cat appcenter-version.env
  artifacts:
    reports:
      dotenv: appcenter-version.env

.changes-python: &changes-python
  - "pyproject.toml"
  - "uv.lock"
  - "standalone-files/**/*"
  - "tests/**/*"
  - "unit_tests/**/*"
  - "univention-ox-provisioning/**/*"
  - "univention-ox-soap-api/**/*"

.changes-helm: &changes-helm
  - "helm/**/*"
  - "helm-unittests/**/*"

.python-change-rules: &python-change-rules
  - if: '$RUN_RENOVATE == "yes"'
    when: never
  - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    changes: *changes-python
  - if: '$CI_PIPELINE_SOURCE != "merge_request_event"'
    when: on_success

.helm-change-rules: &helm-change-rules
  - if: '$RUN_RENOVATE == "yes"'
    when: never
  - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    changes: *changes-helm
  - if: '$CI_PIPELINE_SOURCE != "merge_request_event"'
    when: on_success

test-chart-ox-connector:
  stage: test
  needs: []
  image: "gitregistry.knut.univention.de/univention/dev/nubus-for-k8s/common-helm/testrunner:0.29.21@sha256:2b5fde0de1b980c388a78883fc53d819f9116cf70be577351f6ebd33c9301518"
  script:
    - helm dep build helm/ox-connector
    - pytest -W error helm-unittests/
  rules: *helm-change-rules

lint-render-manifests:
  stage: lint
  needs: []
  image: "gitregistry.knut.univention.de/univention/dev/nubus-for-k8s/common-helm/testrunner:0.29.21@sha256:2b5fde0de1b980c388a78883fc53d819f9116cf70be577351f6ebd33c9301518"
  script:
    - helm dep build helm/ox-connector
    - helm template test helm/ox-connector
      -f helm/ox-connector/linter_values.yaml
      --output-dir manifests/
  artifacts:
    name: rendered-manifests
    expire_in: 1 week
    expose_as: Rendered Kubernetes Manifests
    paths:
      - manifests/
  rules: *helm-change-rules

lint-kubeconform:
  stage: lint
  needs:
    - lint-render-manifests
  image:
    name: ghcr.io/yannh/kubeconform:latest-alpine@sha256:6b90a5f23d846140ce0194fe050b1995e546eba938f3a6bf10c039dd5e24588f
    entrypoint: [""]
  script:
    - /kubeconform -strict -ignore-missing-schemas -summary -output junit manifests/ > kubeconform-report.xml || true
    - /kubeconform -strict -ignore-missing-schemas -summary -output text manifests/
  artifacts:
    reports:
      junit: kubeconform-report.xml
  rules: *helm-change-rules

unit-tests:
  stage: test
  image:
    name: "${CI_REGISTRY_IMAGE}/ox-connector-standalone-test:${RELEASE_VERSION}"
    entrypoint: [""]
  script:
    - python3 -m pytest unit_tests/ -v --cov=univention.ox.provisioning --cov-report=term --cov-report=xml:coverage.xml
  coverage: '/TOTAL.*\s+(\d+%)/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    expire_in: 1 week
  rules: *python-change-rules

generate-docs-pipeline-config:
  stage: prepare
  image:
    name: docker-registry.knut.univention.de/knut/deb-builder@sha256:b1b9f7be8795fbc3e920d9a4bb2f7dddce85d032a06d0d885a78bf5a39222c7d
    entrypoint: [""]
  script:
    - >
      .gitlab-ci/doc-builder
      --yaml .gitlab-ci/base-doc.yml
      --out generated-config-doc.yml
  rules:
    - changes: &changes-docs
        - "docs/**/*"
  artifacts:
    paths:
      - generated-config-doc.yml

# Uses APPCENTER_VERSION internally
trigger-docs:
  stage: "build"
  needs:
    - job: generate-docs-pipeline-config
    - job: get-appcenter-version
  trigger:
    strategy: "depend"
    include:
      - artifact: generated-config-doc.yml
        job: generate-docs-pipeline-config
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: "never"
    - if: $CI_COMMIT_REF_NAME != $CI_DEFAULT_BRANCH
      variables:
        DOC_TARGET_VERSION: "${APPCENTER_VERSION}"
      changes: *changes-docs
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH
      variables:
        DOC_TARGET_VERSION: "${APPCENTER_VERSION}"
      changes: *changes-docs
      when: "manual"
