---
include:
  - project: "univention/dev/nubus-for-k8s/common-ci"
    ref: "v1.65.0"
    file:
      - "defaults/stages.yaml"
      - "defaults/nubus-workflow.yaml"
      - "jobs/lint-pre-commit.yaml"
      - "jobs/lint-commit-messages.yaml"
      - "jobs/semantic-release-env.yaml"
      - "jobs/container-build-external.yaml"
      - "jobs/package-and-publish-helm-charts-external.yaml"
      - "templates/sonarqube.yaml"

  - component: "$CI_SERVER_FQDN/univention/dev/nubus-for-k8s/common-ci/vul-man@v1.55.3"
    inputs:
      helm_chart_name: "ox-connector"
      helm_values: "--helm-values ${CI_PROJECT_DIR}/helm/ox-connector/linter_values.yaml"

  - component: "$CI_SERVER_FQDN/univention/dev/tooling/ci-components/ai-review@2.8.0"

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_OPEN_MERGE_REQUESTS'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_REF_PROTECTED == "true"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "webide"'

variables:
  APPCENTER_VERSION: "3.2.2"

  # Variables for sphinx-docs
  LANG: "C.UTF-8"
  DEBIAN_FRONTEND: "noninteractive"
  UNIVENTION_BASECONF: "/dev/null"
  SOUVAP_HELM_PROJECT_ID: "128"

  # Variables for deploy-and-test
  AUTO_TRIGGER_TESTS:
    description: |
      Deployment and e2e test run will be triggered automatically if this is set
      to "yes".
    value: "no"
    options:
      - "yes"
      - "no"
  SKIP_TESTRUN:
    description: |
      Allows to skip the testrun itself, so that the pipeline can be used to
      create a deployment only.
    value: "no"
    options:
      - "yes"
      - "no"
  SKIP_CLEANUP:
    description: |
      Skips the automatic cleanup after the testrun.
    value: "no"
    options:
      - "yes"
      - "no"

.build-matrix: &build-matrix
  - IMAGE_NAME: "ox-connector-appcenter"
    DOCKERFILE_PATH: "Dockerfile"
    KANIKO_ARGS: "--build-arg version=${DOCKER_BUILD_VERSION}"
  - IMAGE_NAME: "ox-connector-standalone"
    DOCKERFILE_PATH: "Dockerfile.standalone"
    KANIKO_ARGS: "--target=final --build-arg version=${RELEASE_VERSION} --build-arg APPCENTER_DOCKER_TAG=${RELEASE_VERSION}"
  - IMAGE_NAME: "ox-connector-standalone-test"
    DOCKERFILE_PATH: "Dockerfile.standalone"
    KANIKO_ARGS: "--target=test --build-arg version=${RELEASE_VERSION} --build-arg APPCENTER_DOCKER_TAG=${RELEASE_VERSION}"
  - IMAGE_NAME: "ox-extension"
    DOCKERFILE_PATH: "ox-extension/Dockerfile"
  - IMAGE_NAME: "ox-connector-appcenter-test"
    DOCKERFILE_PATH: "Dockerfile"
    KANIKO_ARGS: "--target=test --build-arg version=${DOCKER_BUILD_VERSION}"

.post-build-matrix: &post-build-matrix
  - IMAGE_NAME:
      - "ox-connector-appcenter"
      - "ox-connector-standalone"
      - "ox-connector-standalone-test"
      - "ox-extension"

.publish-matrix: &publish-matrix
  - IMAGE_NAME:
      - "ox-connector-appcenter"
      - "ox-connector-standalone"
      - "ox-connector-standalone-test"
      - "ox-extension"

container-malware-scan:
  parallel:
    matrix: *build-matrix

.version-rules: &version-rules
  - if: '$CI_PIPELINE_SOURCE == "schedule"'
    when: "never"
  - if: $CI_COMMIT_REF_NAME != $CI_DEFAULT_BRANCH
    variables:
      DOCKER_BUILD_VERSION: "${APPCENTER_VERSION}-dev"
  - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH
    variables:
      DOCKER_BUILD_VERSION: "${APPCENTER_VERSION}"

container-build-appcenter:
  stage: "build"
  extends: ".kaniko"
  variables:
    KANIKO_BUILD_CONTEXT: "$CI_PROJECT_DIR"
    # NOTE: Disabled caching due to issues in undetected failing build on
    # branches due to the reuse of the version / tag name based on the branch
    # name.
    KANIKO_CACHE_ARGS: ""
  parallel:
    matrix:
      - IMAGE_NAME: "ox-connector-appcenter"
        DOCKERFILE_PATH: "Dockerfile"
        KANIKO_ARGS: "--build-arg version=${DOCKER_BUILD_VERSION}"
      - IMAGE_NAME: "ox-connector-appcenter-test"
        DOCKERFILE_PATH: "Dockerfile"
        KANIKO_ARGS: "--target=test --build-arg version=${DOCKER_BUILD_VERSION}"
  rules: *version-rules

test-chart-ox-connector:
  stage: test
  needs: []
  image: "gitregistry.knut.univention.de/univention/dev/nubus-for-k8s/common-helm/testrunner:0.29.10"
  script:
    - helm dep build helm/ox-connector
    - pytest -W error helm-unittests/

lint-render-manifests:
  stage: lint
  needs: []
  image: "gitregistry.knut.univention.de/univention/dev/nubus-for-k8s/common-helm/testrunner:0.29.10"
  script:
    - helm dep build helm/ox-connector
    - helm template test helm/ox-connector
        -f helm/ox-connector/linter_values.yaml
        --output-dir manifests/
  artifacts:
    name: rendered-manifests
    expire_in: 1 week
    expose_as: Rendered Kubernetes Manifests
    paths:
      - manifests/

lint-kubeconform:
  stage: lint
  needs:
    - lint-render-manifests
  image:
    name: ghcr.io/yannh/kubeconform:latest-alpine
    entrypoint: [""]
  script:
    - /kubeconform -strict -ignore-missing-schemas -summary -output junit manifests/ > kubeconform-report.xml || true
    - /kubeconform -strict -ignore-missing-schemas -summary -output text manifests/
  artifacts:
    reports:
      junit: kubeconform-report.xml

unit-tests:
  stage: test
  image:
    name: "${CI_REGISTRY_IMAGE}/ox-connector-standalone-test:${RELEASE_VERSION}"
    entrypoint: [""]
  script:
    - pytest unit_tests/ -v --cov=univention.ox.provisioning --cov-report=term --cov-report=xml:coverage.xml
  coverage: '/TOTAL.*\s+(\d+%)/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    expire_in: 1 week

container-build:
  variables:
    KANIKO_BUILD_CONTEXT: "$CI_PROJECT_DIR"
    # NOTE: Disabled caching due to issues in undetected failing build on
    # branches due to the reuse of the version / tag name based on the branch
    # name.
    KANIKO_CACHE_ARGS: ""
  parallel:
    matrix:
      - IMAGE_NAME: "ox-connector-standalone"
        DOCKERFILE_PATH: "Dockerfile.standalone"
        KANIKO_ARGS: "--target=final --build-arg version=${RELEASE_VERSION} --build-arg APPCENTER_BASE_IMAGE_TAG=${RELEASE_VERSION}"
      - IMAGE_NAME: "ox-connector-standalone-test"
        DOCKERFILE_PATH: "Dockerfile.standalone"
        KANIKO_ARGS: "--target=test --build-arg version=${RELEASE_VERSION} --build-arg APPCENTER_BASE_IMAGE_TAG=${RELEASE_VERSION}"
      - IMAGE_NAME: "ox-extension"
        DOCKERFILE_PATH: "ox-extension/Dockerfile"
  needs:
    - job: container-build-appcenter
    - job: pre-semantic-release
  rules: *version-rules

push-image-external:
  parallel:
    matrix: *publish-matrix

container-sign-external:
  parallel:
    matrix: *publish-matrix

container-release-attestation:
  parallel:
    matrix: *publish-matrix

deploy-and-test:
  stage: deploy
  allow_failure: true
  needs:
    - job: publish-chart-external
      artifacts: false
    - job: pre-semantic-release
      artifacts: true
  trigger:
    include:
      - local: .gitlab-ci/deploy-and-test.yaml
    forward:
      pipeline_variables: true
    strategy: depend
  rules:
    - if: '$AUTO_TRIGGER_TESTS == "yes"'
      when: on_success
    - when: manual

generate-docs-pipeline-config:
  stage: prepare
  image:
    name: docker-registry.knut.univention.de/knut/deb-builder
    entrypoint: [""]
  script:
    - >
      .gitlab-ci/doc-builder
      --yaml .gitlab-ci/base-doc.yml
      --out generated-config-doc.yml
  rules:
    - changes: &changes-docs
        - "docs/**/*"
  artifacts:
    paths:
      - generated-config-doc.yml

# Uses APPCENTER_VERSION internally
trigger-docs:
  stage: "build"
  needs:
    - job: generate-docs-pipeline-config
  trigger:
    strategy: "depend"
    include:
      - artifact: generated-config-doc.yml
        job: generate-docs-pipeline-config
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: "never"
    - if: $CI_COMMIT_REF_NAME != $CI_DEFAULT_BRANCH
      variables:
        DOCKER_BUILD_VERSION: "${APPCENTER_VERSION}-dev"
        DOC_TARGET_VERSION: "${DOCKER_BUILD_VERSION}"
      changes: *changes-docs
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH
      variables:
        DOCKER_BUILD_VERSION: "${APPCENTER_VERSION}"
        DOC_TARGET_VERSION: "${DOCKER_BUILD_VERSION}"
      changes: *changes-docs
      when: "manual"

upload-docker-image:
  stage: "publish"
  when: "manual"
  variables:
    GIT_STRATEGY: none
    BUILD_IMAGE_PATH_AND_TAG: "${CI_REGISTRY_IMAGE}/ox-connector-appcenter-test:${RELEASE_VERSION}"
  rules: *version-rules
  image:
    name: "docker-registry.knut.univention.de/knut/ssh"
    entrypoint: [""]
  before_script:
    - chmod 0600 "${SSH_PRIVATE_KEY}"
  script:
    - |
      SSH_ARGS="-o BatchMode=yes -i "${SSH_PRIVATE_KEY}" -l root docker.knut.univention.de"
      PUB_REGISTRY_SERVER="docker-upload.software-univention.de"
      PUB_IMAGE_NAME="ox-connector"
      PUB_REGISTRY_PATH_AND_TAG="${PUB_REGISTRY_SERVER}/${PUB_IMAGE_NAME}:${DOCKER_BUILD_VERSION}"
      ssh ${SSH_ARGS} "docker pull ${BUILD_IMAGE_PATH_AND_TAG}"
      ssh ${SSH_ARGS} "docker tag ${BUILD_IMAGE_PATH_AND_TAG} ${PUB_REGISTRY_PATH_AND_TAG}"
      ssh ${SSH_ARGS} "docker push ${PUB_REGISTRY_PATH_AND_TAG}"

sonarqube:
  extends: .sonarqube
  needs: []
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_BRANCH == 'ucs5.2'
