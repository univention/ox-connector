---

include:
  - project: "univention/dev/docs/sphinx-docker"
    file: "pipeline/sphinx.yml"

default:
  artifacts:
    expire_in: 1 day
  interruptible: true
  retry:
    max: 2
    when:
      - api_failure
      - stuck_or_timeout_failure
      - runner_system_failure

variables:
  GIT_STRATEGY: fetch
  GIT_SUBMODULE_STRATEGY: none
  GIT_DEPTH: "3"

.sphinx-doc:
  variables:
    language: "en"

.sphinx-linkcheck:
  extends:
    - .sphinx-doc
    - .sphinx-linkcheck-template

.sphinx-spelling:
  extends:
    - .sphinx-doc
    - .sphinx-spelling-template

.sphinx-html:
  extends:
    - .sphinx-doc
    - .sphinx-html-template

.sphinx-pdf:
  extends:
    - .sphinx-doc
    - .sphinx-pdf-template

.docs-merge:
  extends: .sphinx-merge-template
  variables:
    GIT_STRATEGY: none
  script:
    - echo "DOC_ARTIFACT_URL=$CI_API_V4_URL/projects/$CI_PROJECT_ID/jobs/$CI_JOB_ID/artifacts" > doc.env
    - export ENTRY="$(find out -maxdepth 4 -name index.html | sort | head -n 1)"
    - echo "DOC_REVIEW_URL=${CI_SERVER_PROTOCOL}://${CI_PROJECT_ROOT_NAMESPACE}.${CI_PAGES_DOMAIN-gitpages.knut.univention.de}/-/${CI_PROJECT_PATH#${CI_PROJECT_ROOT_NAMESPACE}/}/-/jobs/$CI_JOB_ID/artifacts/$ENTRY" >> doc.env
