---

repos:
  - repo: "https://github.com/pre-commit/pre-commit-hooks"
    rev: "v6.0.0"
    hooks:
      - id: "check-added-large-files"
        name: "check for added large files"
      - id: "check-executables-have-shebangs"
        name: "check that executables have shebangs"
      - id: "check-merge-conflict"
        name: "check for merge conflicts"
      - id: "check-yaml"
        name: "check yaml"
        args: [--allow-multiple-documents]
        exclude: "^(helm/.+/templates/|udm/udm-data-loader/)"
      - id: "end-of-file-fixer"
        name: "fix end of files"
        exclude: "^helm/.+/README.md$"
      - id: "trailing-whitespace"
        name: "trim trailing whitespace"

  - repo: "https://github.com/compilerla/conventional-pre-commit"
    rev: "v4.2.0"
    hooks:
      - id: "conventional-pre-commit"
        stages: ["commit-msg"]
        args: [--strict]

  - repo: "https://github.com/psf/black"
    rev: "25.1.0"
    hooks:
      - id: "black"
        args:
          - "--skip-string-normalization"
          - "--line-length=79"
          - "--target-version=py311"

  - repo: "https://github.com/astral-sh/ruff-pre-commit"
    rev: "v0.12.10"
    hooks:
      - id: "ruff"
        name: "ruff"
        args:
          - "check"
          - "--fix"
          - "--exit-non-zero-on-fix"
          - "--extend-select=COM"
          # E501 Line too long (<chars> > 88 characters)
          # E902 No such file or directory
          - "--ignore=E501,E902"

  - repo: "https://gitlab.com/univention/pre-commit-hooks/pre-commit-shell"
    rev: "v1.0.6+uv1"
    hooks:
      - id: "shell-lint"
        name: "Shell Syntax Check"
        args:
          - "--enable=all"
        # Skip if shellcheck is not installed
        exclude: ".*"  # Temporarily exclude all files until shellcheck is available

  - repo: "https://github.com/hadolint/hadolint"
    rev: "v2.13.1-beta"
    hooks:
      - id: "hadolint"
        name: "Lint Dockerfiles"
        types: ["dockerfile"]
        exclude: "^Dockerfile.standalone.dockerignore$"
        args:
          - "--no-color"
          - "--strict-labels"
          - "--ignore=DL3050"
          - "--ignore=DL3008"
          - "--ignore=DL3018"

  - repo: "https://gitlab.com/univention/pre-commit-hooks/docker-compose-check"
    rev: "7702a8801a158b8595569dd29e2dd655d8a08310"
    hooks:
      - id: "docker-compose-check"
        name: "Validate docker-compose files"

  - repo: "https://github.com/gruntwork-io/pre-commit"
    rev: "v0.1.30"
    hooks:
      - id: "helmlint"
        name: "helmlint"

  - repo: "https://github.com/norwoodj/helm-docs"
    rev: "v1.14.2"
    hooks:
      - id: "helm-docs"
        name: "Helm Docs"
        args:
          - "--chart-search-root=helm"
          - "--template-files=README.md.gotmpl"
        always_run: true
      - id: "helm-docs-built"
        name: "Helm Docs Built"

  - repo: "https://git.knut.univention.de/univention/infrastructure/pre-commit-hooks/addlicense"
    rev: "v1.0.3"
    hooks:
      - id: "addlicense"
        name: "Check or add license headers to files"


  - repo: "https://git.knut.univention.de/univention/dev/tooling/kyverno-test-pre-commit"
    rev: "v0.5.0"
    hooks:
      - id: kyverno-test

...
